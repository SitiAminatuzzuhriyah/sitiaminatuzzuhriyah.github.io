    <script src="https://cdn.tailwindcss.com"></script>
    <script>

                        'elegant': ['Lora', 'serif'],

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-transition {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        html {
            scroll-behavior: smooth;
        }
        .text-justify-clean {
            text-align: justify;
            text-justify: inter-word;
        }

        /* Dark Mode Manual Overrides */
        .dark body { background-color: #121212; color: #E0E0E0; }
        .dark nav { background-color: rgba(18, 18, 18, 0.85) !important; border-color: rgba(255, 255, 255, 0.1); }
        .dark .bg-card-bg { background-color: #1E1E1E !important; }
        .dark .bg-soft-bg { background-color: #121212 !important; }
        .dark .bg-white { background-color: #1E1E1E !important; color: #E0E0E0 !important; border-color: rgba(255,255,255,0.1) !important; }
        .dark .text-slate-800 { color: #F3F4F6 !important; }
        .dark .text-soft-text { color: #A0A0A0 !important; }
        .dark .border-taupe\/30 { border-color: rgba(255,255,255,0.15) !important; }
    </style>
</head>
<body class="bg-soft-bg text-soft-text font-sans antialiased overflow-x-hidden page-transition">

    <nav class="fixed w-full z-50 bg-soft-bg/80 backdrop-blur-md border-b border-taupe/30 transition-all duration-300">
        <div class="flex justify-between items-center py-5 px-10 max-w-6xl mx-auto">
            <a href="../" class="font-elegant italic font-semibold text-2xl text-sage-dark tracking-wide">zuhriyah.</a>
            <div class="flex items-center space-x-6 text-sm font-medium">
                <div class="space-x-8 hidden md:block">
                    <a href="../" class="relative group hover:text-sage-dark transition duration-300" data-i18n="navAbout">Tentang</a>
                    <a href="../karya/" class="relative group hover:text-sage-dark transition duration-300" data-i18n="navWorks">Karya</a>
                    <a href="../experience/" class="relative group hover:text-sage-dark transition duration-300" data-i18n="navExp">Pengalaman</a>
                    <a href="../kompetisi/" class="relative group hover:text-sage-dark transition duration-300" data-i18n="navComp">Kompetisi</a>
                </div>
                
                <div class="flex items-center space-x-3">
                    <div class="flex items-center border border-sage/50 rounded-full p-0.5 text-xs font-semibold">
                        <button onclick="setLanguage('id')" id="lang-id" class="px-2.5 py-1 rounded-full transition-all text-sage-dark">ID</button>
                        <button onclick="setLanguage('en')" id="lang-en" class="px-2.5 py-1 rounded-full transition-all text-sage-dark/60">EN</button>
                    </div>

                    <div class="flex items-center border border-sage/50 rounded-full p-0.5 text-xs font-semibold">
                        <button onclick="setTheme('light')" id="theme-light" class="w-7 h-7 rounded-full flex items-center justify-center transition-all text-sage-dark" title="Light Mode">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
                            </svg>
                        </button>
                        <button onclick="setTheme('dark')" id="theme-dark" class="w-7 h-7 rounded-full flex items-center justify-center transition-all text-sage-dark/60" title="Dark Mode">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <a href="../kontak/" class="hidden md:inline-block px-5 py-2.5 bg-sage text-white rounded-full transition-all duration-300" data-i18n="navChat">Mari Berbincang</a>
            </div>
        </div>
    </nav>

    <section class="min-h-screen flex flex-col justify-center items-center text-center px-6 py-24 bg-soft-bg">

            <h2 class="font-elegant text-4xl text-slate-800" data-i18n="contactTitle">Mari Berkolaborasi.</h2>
            <p class="text-soft-text font-light text-lg text-justify-clean" data-i18n="contactSub">Terbuka untuk diskusi proyek kreatif atau peluang profesional di bidang teknologi dan data.</p>
            <div class="flex flex-wrap justify-center gap-4 md:gap-6 pt-6">
                <a href="mailto:zuhriyah2812@gmail.com" class="px-6 py-3 bg-sage-dark text-white rounded-full font-medium hover:bg-slate-800 hover:shadow-lg transition-all duration-300" data-i18n="btnEmail">Email</a>
                <a href="https://wa.me/6281326462073" target="_blank" class="px-6 py-3 bg-sage-dark text-white rounded-full font-medium hover:bg-slate-800 hover:shadow-lg transition-all duration-300" data-i18n="btnWhatsapp">WhatsApp</a>
                <a href="https://linkedin.com/in/siti-aminatuzzuhriyah" target="_blank" class="px-6 py-3 border border-sage-dark text-sage-dark rounded-full font-medium hover:bg-sage/10 transition-all duration-300" data-i18n="btnLinkedin">LinkedIn</a>
                <a href="https://instagram.com/riaaazhh" target="_blank" class="px-6 py-3 border border-sage-dark text-sage-dark rounded-full font-medium hover:bg-sage/10 transition-all duration-300" data-i18n="btnInstagram">Instagram</a>
            </div>
            <p class="pt-16 text-xs text-taupe font-light" data-i18n="copyright">© 2026 Siti Aminatuzzuhriyah. Dirancang dengan keanggunan.</p>
        </div>
    </section>

    <script>
        const translations = {
            id: {
                navAbout: "Tentang",
                navWorks: "Karya",
                navExp: "Pengalaman",
                navComp: "Kompetisi",
                navChat: "Mari Berbincang",
                contactTitle: "Mari Berkolaborasi.",
                contactSub: "Terbuka untuk diskusi proyek kreatif atau peluang profesional di bidang teknologi dan data.",
                btnEmail: "Email",
                btnWhatsapp: "WhatsApp",
                btnLinkedin: "LinkedIn",
                btnInstagram: "Instagram",
                copyright: "© 2026 Siti Aminatuzzuhriyah. Dirancang dengan keanggunan."
            },
            en: {
                navAbout: "About",
                navWorks: "Works",
                navExp: "Experience",
                navComp: "Competitions",
                navChat: "Let's Talk",
                contactTitle: "Let's Collaborate.",
                contactSub: "Open for creative project discussions or professional opportunities in technology and data fields.",
                btnEmail: "Email",
                btnWhatsapp: "WhatsApp",
                btnLinkedin: "LinkedIn",
                btnInstagram: "Instagram",
                copyright: "© 2026 Siti Aminatuzzuhriyah. Designed with elegance."
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);

            const savedLang = localStorage.getItem('lang') || 'id';
            setLanguage(savedLang);
        });

        function setTheme(theme) {
            document.documentElement.className = theme;
            localStorage.setItem('theme', theme);

            const btnLight = document.getElementById('theme-light');
            const btnDark = document.getElementById('theme-dark');

            if(theme === 'light') {
                btnLight.className = "w-7 h-7 rounded-full bg-sage text-white flex items-center justify-center transition-all shadow-sm";
                btnDark.className = "w-7 h-7 rounded-full flex items-center justify-center transition-all text-sage-dark/60 hover:text-sage-dark";
            } else {
                btnDark.className = "w-7 h-7 rounded-full bg-sage text-white flex items-center justify-center transition-all shadow-sm";
                btnLight.className = "w-7 h-7 rounded-full flex items-center justify-center transition-all text-sage-dark/60 hover:text-sage-dark";
            }
        }

        function setLanguage(lang) {
            localStorage.setItem('lang', lang);

            const btnId = document.getElementById('lang-id');
            const btnEn = document.getElementById('lang-en');
            if(lang === 'id') {
                btnId.className = "px-2.5 py-1 rounded-full bg-sage text-white transition-all shadow-sm";
                btnEn.className = "px-2.5 py-1 rounded-full transition-all text-sage-dark/60 hover:text-sage-dark";
            } else {
                btnEn.className = "px-2.5 py-1 rounded-full bg-sage text-white transition-all shadow-sm";
                btnId.className = "px-2.5 py-1 rounded-full transition-all text-sage-dark/60 hover:text-sage-dark";
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.innerHTML = translations[lang][key];
                }
            });
        }
    </script>
</body>
</html>
